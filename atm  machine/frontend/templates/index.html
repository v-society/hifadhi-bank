<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <title>HIFADHI ATM</title>
</head>
<body>
    <div class="logo">
        <span>
            HIFADHI ATM
        </span>
    </div>
    <div class="atm">
        <div class="cash">
            <div class="cash-container">
                here we add our note images
            </div>
            <div class="balance-wrapper">
                <div>notes counter</div>
            </div>
        </div>
        <div class="dialer">
            <div class="display-row">
                <div class="display1" id="display1" aria-live="polite">
                    <img class="hifadhi-logo" id="hifadhi-logo" src="../templates/logo.png" alt="Hifadhi Bank logo" hidden>
                    <div class="atm-menu" id="atm-menu" hidden>
                        <strong id="atm-menu-title">Authenticate to continue</strong>
                        <div id="atm-menu-options" hidden>
                            <div>1. Deposit</div>
                            <div>2. Withdraw</div>
                            <div>3. Logout</div>
                            <div>4. Check balance</div>
                        </div>
                        <div id="atm-message" role="status"></div>
                    </div>
                </div>
                <button class="eject-button" id="eject-card" type="button" hidden>Eject card</button>
            </div>
            <input id="display" class="display" disabled placeholder="HIFADHI">
            <div class="buttons">
                <div>
                    <button value="1">1</button>
                    <button value="2">2</button>
                    <button value="3">3</button>
                </div>
                <div>
                    <button value="4">4</button>
                    <button value="5">5</button>
                    <button value="6">6</button>
                </div>
                <div>
                    <button value="7">7</button>
                    <button value="8">8</button>
                    <button value="9">9</button>
                </div>
                <div>
                    <button value="0">0</button>
                    <button value="00">00</button>
                    <button value="000">000</button>
                </div>
                <div>
                    <button id="delete">delete</button>
                    <button id="enter">enter</button>
                
                </div>
            </div>
            <div class="card-reader-slot" aria-label="Card reader slot"></div>
        </div>
        <div class="card">
             <div class="bank-card">
        <div class="logo1">
            <div class="img">
            </div>
            <div class="s"></div>
           
        </div>
        <div class="classified">
            <div class="chip"></div>
            <div id="card-number-display">1234-5678-9012-3456</div>
        </div>
        <div class="user" id="name-wrapper">
            name and expirary date
        </div>
    </div>
    <form class="card-form">
        <label for="card-number">Card number</label>
        <div class="card-form-controls">
            <input id="card-number" name="card_number" type="text" inputmode="numeric" autocomplete="cc-number" placeholder="Enter 6-digit card number" maxlength="6" pattern="[0-9]{6}" title="Enter exactly 6 digits" required>
            <button type="submit">Submit</button>
        </div>
        <p id="card-status" role="status" aria-live="polite"></p>
        <div class="card-numpad" aria-label="Card number keypad">
            <button type="button" data-digit="1">1</button>
            <button type="button" data-digit="2">2</button>
            <button type="button" data-digit="3">3</button>
            <button type="button" data-digit="4">4</button>
            <button type="button" data-digit="5">5</button>
            <button type="button" data-digit="6">6</button>
            <button type="button" data-digit="7">7</button>
            <button type="button" data-digit="8">8</button>
            <button type="button" data-digit="9">9</button>
            <button type="button" data-action="clear">Clear</button>
            <button type="button" data-digit="0">0</button>
            <button type="button" data-action="delete" aria-label="Delete last digit">Del</button>
        </div>
    </form>
        </div>
    </div>    
    <script src="../scipt/script.js"></script>
</body>
</html>
